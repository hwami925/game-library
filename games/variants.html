<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 의상 기록 | SCHALE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #173d5c;
      background: #d9eaf5;
    }

    .page {
      max-width: 1400px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 35px 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .system-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #628fb0;
    }

    .back-button {
      padding: 11px 20px;
      border: 1px solid #b5d1e3;
      border-radius: 8px;
      background: white;
      color: #245c82;
      font-weight: bold;
      text-decoration: none;
    }

    /* 펼쳐진 학생 기록부 */
    .folder {
      position: relative;
      min-height: 730px;
      padding: 40px 48px 45px;
      border: 12px solid #83b8dc;
      border-radius: 18px;
      background: #fffefb;
      box-shadow: 0 15px 35px rgba(34, 79, 115, 0.17);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 20px;
      border-bottom: 1px solid #d9e7ef;
    }

    .school-logo {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #8aabc3;
    }

    .subtitle {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #86a9c2;
    }

    /* 캐릭터를 카드 없이 나란히 배치 */
    .characters {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 8px;
      min-height: 540px;
      margin-top: 10px;
    }

    .character {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      max-width: 400px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .character-image {
      display: flex;
      width: 100%;
      height: 455px;
      justify-content: center;
      align-items: flex-end;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .character-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }

    .character:hover .character-image {
      transform: translateY(-12px) scale(1.055);
      filter: drop-shadow(0 10px 10px rgba(55, 119, 160, 0.2));
    }

    .character-name {
      width: 100%;
      margin-top: 12px;
      padding: 15px 5px;
      border-top: 2px solid #a7cce5;
      text-align: center;
      transition: border-color 0.2s ease;
    }

    .character-name strong {
      display: block;
      font-size: 20px;
    }

    .character-name span {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #88a8c0;
    }

    .character:hover .character-name {
      border-color: #268fd1;
    }

    .footer-note {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #8aa7b9;
    }

    @media (max-width: 800px) {
      .page {
        padding: 15px;
      }

      .folder {
        min-height: auto;
        padding: 25px 15px;
        border-width: 7px;
      }

      .folder::before {
        display: none;
      }

      .characters {
        gap: 3px;
        min-height: 350px;
      }

      .character-image {
        height: 290px;
      }

      .character-name strong {
        font-size: 14px;
      }

      .character-name span {
        font-size: 9px;
        letter-spacing: 0;
      }

      .header h1 {
        font-size: 24px;
      }

      .school-logo {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="topbar">
      <div class="system-name">SCHALE / STUDENT ARCHIVE</div>
      <a class="back-button" href="students.html">← 학생 명부</a>
    </div>

    <section class="folder">

      <header class="header">
        <img
          class="school-logo"
          src="../images/bluearchive/schools/abydos.png"
          alt="아비도스 교표"
        >

        <div>
          <h1 id="student-name">호시노</h1>
          <p id="student-english">HOSHINO</p>
        </div>
      </header>

      <div class="subtitle">SELECT STUDENT RECORD</div>

      <div class="characters" id="characters"></div>

      <div class="footer-note">
        열람할 학생 기록을 선택하세요.
      </div>

    </section>
  </main>

  <script>
    const characterData = {
      hoshino: {
        name: "호시노",
        english: "HOSHINO",
        variants: [
          {
            id: "default",
            name: "기본",
            english: "DEFAULT"
          },
          {
            id: "swimsuit",
            name: "수영복",
            english: "SWIMSUIT"
          },
          {
            id: "armed",
            name: "무장",
            english: "ARMED"
          }
        ]
      }
    };

    const params = new URLSearchParams(window.location.search);
    const characterId = params.get("student") || "hoshino";
    const character = characterData[characterId] || characterData.hoshino;

    document.getElementById("student-name").textContent = character.name;
    document.getElementById("student-english").textContent = character.english;

    const container = document.getElementById("characters");

    character.variants.forEach((variant) => {
      const imagePath =
        `../images/bluearchive/variants/${characterId}/${variant.id}.png`;

      const link = document.createElement("a");
      link.className = "character";

      // 상세 기록부 페이지를 제작하면 이 주소로 연결됨
      link.href =
        `details.html?student=${characterId}&variant=${variant.id}`;

      link.innerHTML = `
        <div class="character-image">
          <img src="${imagePath}" alt="${character.name} ${variant.name}">
        </div>

        <div class="character-name">
          <strong>${character.name}${variant.id === "default" ? "" : `(${variant.name})`}</strong>
          <span>${variant.english}</span>
        </div>
      `;

      container.appendChild(link);
    });
  </script>
</body>
</html>
