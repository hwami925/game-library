<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생기록부 | 블루 아카이브 | 게임창고</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: #214563;
      background:
        radial-gradient(circle at 85% 15%, #b5e5ff 0%, transparent 40%),
        linear-gradient(135deg, #f4fbff, #dcefff);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image:
        linear-gradient(#fff 1px, transparent 1px),
        linear-gradient(90deg, #fff 1px, transparent 1px);
      background-size: 60px 60px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 6%;
      background: rgba(255, 255, 255, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .site-name {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .back-button {
      color: #438fbf;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      position: relative;
      width: min(1150px, 100%);
      margin: 0 auto;
      padding: 65px 24px 90px;
    }

    .system-label {
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(30px, 5vw, 48px);
    }

    .subtitle {
      margin: 0 0 35px;
      color: #718da4;
      line-height: 1.7;
    }

    .database-panel {
      padding: clamp(24px, 4vw, 42px);
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid white;
      border-radius: 26px;
      box-shadow: 0 20px 55px rgba(61, 136, 190, 0.12);
      backdrop-filter: blur(15px);
    }

    /* 학생 검색 */

    .search-label {
      display: block;
      margin-bottom: 12px;
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 60px;
      background: white;
      border: 1px solid #b8e2fa;
      border-radius: 15px;
    }

    .search-icon {
      color: #5296c4;
      font-size: 23px;
    }

    .search-box input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #214563;
      font: inherit;
      font-size: 16px;
    }

    .search-box:focus-within {
      border-color: #54b4ed;
      box-shadow: 0 0 0 4px rgba(84, 180, 237, 0.12);
    }

    .search-notice {
      min-height: 20px;
      margin: 12px 0 35px;
      color: #718da4;
      font-size: 13px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 25px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 23px;
    }

    .school-count {
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* 학교 서류철 배치 */

    .school-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 26px 22px;
    }

    /* 서류철 카드 */

    .school-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      aspect-ratio: 3 / 4;
      padding: 17px 16px 20px;
      border: 1px solid #78c9e9;
      border-radius: 5px 13px 7px 7px;
      background:
        linear-gradient(
          145deg,
          transparent 0%,
          transparent 37%,
          rgba(255, 255, 255, 0.13) 37%,
          rgba(255, 255, 255, 0.13) 58%,
          transparent 58%
        ),
        linear-gradient(
          35deg,
          rgba(17, 120, 180, 0.12) 0%,
          transparent 45%
        ),
        linear-gradient(
          160deg,
          #9bdcf1 0%,
          #66c3e8 52%,
          #a6e0f2 100%
        );
      box-shadow:
        3px 5px 0 rgba(42, 127, 169, 0.15),
        0 12px 22px rgba(41, 121, 170, 0.13);
      cursor: pointer;
      font: inherit;
      color: #285a79;
      text-align: center;
      isolation: isolate;
      transition:
        transform 0.25s,
        box-shadow 0.25s;
    }

    .school-card:hover {
      transform: translateY(-9px) rotate(-1deg);
      box-shadow:
        5px 8px 0 rgba(42, 127, 169, 0.13),
        0 22px 30px rgba(41, 121, 170, 0.22);
    }

    .school-card:focus-visible {
      outline: 3px solid #268dcc;
      outline-offset: 5px;
    }

    /* 서류철 오른쪽 접힘 부분 */

    .school-card::before {
      content: "";
      position: absolute;
      top: 8%;
      right: 0;
      width: 8px;
      height: 84%;
      background: rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(34, 129, 178, 0.18);
      z-index: -1;
    }

    /* 오른쪽 인덱스 탭 */

    .folder-tab {
      position: absolute;
      right: -9px;
      top: 43%;
      width: 15px;
      height: 36px;
      border-radius: 0 4px 4px 0;
      background: #f5ad7f;
      box-shadow: 2px 3px 5px rgba(41, 121, 170, 0.12);
    }

    /* 상단 문서 라벨 */

    .folder-label {
      display: grid;
      place-items: center;
      width: 85%;
      min-height: 31px;
      padding: 5px 8px;
      border: 1px solid rgba(107, 136, 177, 0.25);
      border-radius: 5px;
      background: linear-gradient(110deg, #f6eafa, #fff7e6);
      color: #535b87;
      font-size: clamp(9px, 0.9vw, 12px);
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 3px 7px rgba(44, 106, 148, 0.1);
    }

    /* 중앙 문양 영역 */

    .folder-emblem-area {
      position: relative;
      display: grid;
      place-items: center;
      width: 88%;
      flex: 1;
      min-height: 0;
      margin: 8px 0;
    }

    .emblem-ring {
      position: absolute;
      width: 82%;
      aspect-ratio: 1;
      border: 2px solid rgba(45, 136, 179, 0.35);
      border-radius: 50%;
    }

    .emblem-ring::before {
      content: "";
      position: absolute;
      inset: 10%;
      border: 1px solid rgba(45, 136, 179, 0.28);
      border-radius: 50%;
    }

    .emblem-ring::after {
      content: "";
      position: absolute;
      top: 50%;
      left: -12%;
      width: 124%;
      height: 1px;
      background: rgba(45, 136, 179, 0.35);
    }

    /* 실제 학교 문양이 들어갈 자리 */

    .school-emblem {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 65%;
      aspect-ratio: 1;
      color: rgba(33, 110, 151, 0.55);
      font-size: clamp(25px, 3vw, 43px);
      font-weight: 800;
    }

    .school-emblem img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 하단 학교 이름 라벨 */

    .folder-name {
      display: grid;
      place-items: center;
      width: 83%;
      min-height: 36px;
      padding: 7px 5px;
      border: 1px solid rgba(107, 136, 177, 0.25);
      border-radius: 5px;
      background: linear-gradient(110deg, #f6eafa, #fff7e6);
      color: #43516e;
      font-size: clamp(11px, 1.2vw, 15px);
      font-weight: 800;
      box-shadow: 0 3px 7px rgba(44, 106, 148, 0.1);
    }

    .folder-english {
      margin-top: 10px;
      color: rgba(30, 98, 139, 0.75);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
    }

    /* 시스템 상태 */

    .status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 35px;
      color: #5296c4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4cc1d8;
      box-shadow: 0 0 10px #4cc1d8;
    }

    @media (max-width: 900px) {
      .school-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      header {
        padding: 18px 20px;
      }

      main {
        padding: 35px 18px 60px;
      }

      .database-panel {
        padding: 20px;
      }

      .school-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 15px;
      }

      .folder-label {
        font-size: 9px;
      }

      .folder-name {
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      .school-grid {
        grid-template-columns: 1fr;
      }

      .school-card {
        max-width: 260px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="site-name" href="../index.html">
      📦 게임창고
    </a>

    <a class="back-button" href="bluearchive.html">
      ← 블루 아카이브
    </a>
  </header>

  <main>

    <div class="system-label">
      SCHALE STUDENT DATABASE
    </div>

    <h1>학생기록부</h1>

    <p class="subtitle">
      학교별 서류철을 선택하여 소속 동아리와 학생 정보를 열람하세요.
    </p>

    <section class="database-panel">

      <label class="search-label" for="student-search">
        STUDENT SEARCH
      </label>

      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="student-search"
          placeholder="학생 이름을 입력하세요"
          autocomplete="off"
        >
      </div>

      <p class="search-notice" id="search-notice">
        학생 검색 데이터는 추후 연결됩니다.
      </p>

      <div class="section-title">
        <h2>학교 목록</h2>
        <span class="school-count" id="school-count"></span>
      </div>

      <div class="school-grid" id="school-grid"></div>

      <div class="status">
        <span class="status-dot"></span>
        SCHALE DATABASE / ONLINE
      </div>

    </section>
  </main>

  <script>
    // 학교 순서: 화미가 지정한 17개 항목
    const schools = [
      { name: "샬레", english: "SCHALE", slug: "schale" },
      { name: "총학생회", english: "GENERAL STUDENT COUNCIL", slug: "general-student-council" },
      { name: "아비도스", english: "ABYDOS", slug: "abydos" },
      { name: "게헨나", english: "GEHENNA", slug: "gehenna" },
      { name: "밀레니엄", english: "MILLENNIUM", slug: "millennium" },
      { name: "트리니티", english: "TRINITY", slug: "trinity" },
      { name: "백귀야행", english: "HYAKKIYAKO", slug: "hyakkiyako" },
      { name: "산해경", english: "SHANHAIJING", slug: "shanhaijing" },
      { name: "붉은겨울", english: "RED WINTER", slug: "red-winter" },
      { name: "발키리", english: "VALKYRIE", slug: "valkyrie" },
      { name: "SRT", english: "SRT", slug: "srt" },
      { name: "아리우스", english: "ARIUS", slug: "arius" },
      { name: "하이랜더", english: "HIGHLANDER", slug: "highlander" },
      { name: "와일드헌트", english: "WILD HUNT", slug: "wild-hunt" },
      { name: "오디세이아", english: "ODYSSEIA", slug: "odysseia" },
      { name: "크로노스", english: "KRONOS", slug: "kronos" },
      { name: "기타", english: "OTHERS", slug: "others" }
    ];

    const schoolGrid = document.getElementById("school-grid");
    const schoolCount = document.getElementById("school-count");
    const studentSearch = document.getElementById("student-search");
    const searchNotice = document.getElementById("search-notice");

    schoolCount.textContent = `${schools.length} RECORDS`;

    schools.forEach((school) => {
      const card = document.createElement("button");

      card.type = "button";
      card.className = "school-card";
      card.setAttribute("aria-label", `${school.name} 학생 기록 열람`);

      // 학교별 문양 이미지 경로
      const emblemPath = `../images/bluearchive/schools/${school.slug}.png`;

      card.innerHTML = `
        <span class="folder-tab"></span>

        <span class="folder-label">
          STUDENT RECORD
        </span>

        <span class="folder-emblem-area">
          <span class="emblem-ring"></span>

          <span class="school-emblem">
            <img
              src="${emblemPath}"
              alt=""
              onerror="this.style.display='none'; this.parentElement.textContent='✦';"
            >
          </span>
        </span>

        <span class="folder-name">
          ${school.name}
        </span>

        <span class="folder-english">
          ${school.english}
        </span>
      `;

card.addEventListener("click", () => {
  window.location.href = `clubs.html?school=${school.slug}`;
});

      schoolGrid.appendChild(card);
    });

    studentSearch.addEventListener("input", () => {
      const query = studentSearch.value.trim();

      if (!query) {
        searchNotice.textContent = "학생 검색 데이터는 추후 연결됩니다.";
        return;
      }

      searchNotice.textContent =
        `"${query}" 검색 기능은 학생 데이터 등록 후 사용할 수 있습니다.`;
    });
  </script>

</body>
</html>
