<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생기록부 | 블루 아카이브 | 게임창고</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: #214563;
      background:
        radial-gradient(circle at 85% 15%, #b5e5ff 0%, transparent 40%),
        linear-gradient(135deg, #f4fbff, #dcefff);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image:
        linear-gradient(#fff 1px, transparent 1px),
        linear-gradient(90deg, #fff 1px, transparent 1px);
      background-size: 60px 60px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 6%;
      background: rgba(255, 255, 255, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .site-name {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .back-button {
      color: #438fbf;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      position: relative;
      width: min(1150px, 100%);
      margin: 0 auto;
      padding: 65px 24px 90px;
    }

    .system-label {
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(30px, 5vw, 48px);
    }

    .subtitle {
      margin: 0 0 35px;
      color: #718da4;
      line-height: 1.7;
    }

    .database-panel {
      padding: clamp(24px, 4vw, 42px);
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid white;
      border-radius: 26px;
      box-shadow: 0 20px 55px rgba(61, 136, 190, 0.12);
      backdrop-filter: blur(15px);
    }

    .search-label {
      display: block;
      margin-bottom: 12px;
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 60px;
      background: white;
      border: 1px solid #b8e2fa;
      border-radius: 15px;
    }

    .search-icon {
      color: #5296c4;
      font-size: 23px;
    }

    .search-box input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #214563;
      font: inherit;
      font-size: 16px;
    }

    .search-box:focus-within {
      border-color: #54b4ed;
      box-shadow: 0 0 0 4px rgba(84, 180, 237, 0.12);
    }

    .search-notice {
      min-height: 20px;
      margin: 12px 0 35px;
      color: #718da4;
      font-size: 13px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 23px;
    }

    .school-count {
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .school-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .school-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      min-height: 180px;
      padding: 25px;
      background: rgba(240, 249, 255, 0.9);
      border: 1px solid #b8e2fa;
      border-radius: 18px;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition:
        transform 0.25s,
        box-shadow 0.25s,
        border-color 0.25s;
    }

    .school-card:hover {
      transform: translateY(-5px);
      border-color: #54b4ed;
      box-shadow: 0 15px 30px rgba(54, 145, 205, 0.15);
    }

    .school-icon {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      border-radius: 15px;
      background: #ddf2ff;
      color: #268dcc;
      font-size: 29px;
      font-weight: 800;
    }

    .school-info {
      width: 100%;
    }

    .school-name {
      display: block;
      margin-bottom: 8px;
      font-size: 19px;
      font-weight: 800;
    }

    .school-description {
      display: block;
      color: #718da4;
      font-size: 13px;
    }

    .school-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      color: #5296c4;
      font-size: 12px;
      font-weight: 700;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 25px;
      color: #5296c4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4cc1d8;
      box-shadow: 0 0 10px #4cc1d8;
    }

    @media (max-width: 850px) {
      .school-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      header {
        padding: 18px 20px;
      }

      main {
        padding: 35px 18px 60px;
      }

      .database-panel {
        padding: 20px;
      }

      .school-grid {
        grid-template-columns: 1fr;
      }

      .school-card {
        min-height: 150px;
      }

      .section-title h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="site-name" href="../index.html">
      📦 게임창고
    </a>

    <a class="back-button" href="bluearchive.html">
      ← 블루 아카이브
    </a>
  </header>

  <main>
    <div class="system-label">
      SCHALE STUDENT DATABASE
    </div>

    <h1>학생기록부</h1>

    <p class="subtitle">
      학교를 선택하여 소속 동아리와 학생 정보를 열람하세요.
    </p>

    <section class="database-panel">

      <label class="search-label" for="student-search">
        STUDENT SEARCH
      </label>

      <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="student-search"
          placeholder="학생 이름을 입력하세요"
          autocomplete="off"
        >
      </div>

      <p class="search-notice" id="search-notice">
        학생 검색 데이터는 추후 연결됩니다.
      </p>

      <div class="section-title">
        <h2>학교 목록</h2>
        <span class="school-count" id="school-count"></span>
      </div>

      <div class="school-grid" id="school-grid"></div>

      <div class="status">
        <span class="status-dot"></span>
        SCHALE DATABASE / ONLINE
      </div>

    </section>
  </main>

  <script>
    // PPT 목차 순서를 기준으로 작성한 학교 및 분류 목록
const schools = [
  { name: "샬레", english: "SCHALE" },
  { name: "총학생회", english: "GENERAL STUDENT COUNCIL" },
  { name: "아비도스", english: "ABYDOS" },
  { name: "게헨나", english: "GEHENNA" },
  { name: "밀레니엄", english: "MILLENNIUM" },
  { name: "트리니티", english: "TRINITY" },
  { name: "백귀야행", english: "HYAKKIYAKO" },
  { name: "산해경", english: "SHANHAIJING" },
  { name: "붉은겨울", english: "RED WINTER" },
  { name: "발키리", english: "VALKYRIE" },
  { name: "SRT", english: "SRT" },
  { name: "아리우스", english: "ARIUS" },
  { name: "하이랜더", english: "HIGHLANDER" },
  { name: "와일드헌트", english: "WILD HUNT" },
  { name: "오디세이아", english: "ODYSSEIA" },
  { name: "크로노스", english: "KRONOS" },
  { name: "기타", english: "OTHERS" }
];

    const schoolGrid = document.getElementById("school-grid");
    const schoolCount = document.getElementById("school-count");
    const studentSearch = document.getElementById("student-search");
    const searchNotice = document.getElementById("search-notice");

    schoolCount.textContent = `${schools.length} RECORDS`;

    schools.forEach((school, index) => {
      const card = document.createElement("button");

      card.type = "button";
      card.className = "school-card";

      card.innerHTML = `
        <div class="school-icon">▤</div>

        <div class="school-info">
          <span class="school-name">${school.name}</span>
          <span class="school-description">${school.english}</span>
        </div>

        <div class="school-bottom">
          <span>FILE ${String(index + 1).padStart(2, "0")}</span>
          <span>↗</span>
        </div>
      `;

      card.addEventListener("click", () => {
        alert(`${school.name}의 동아리 목록은 다음 단계에서 제작할 예정이야!`);
      });

      schoolGrid.appendChild(card);
    });

    studentSearch.addEventListener("input", () => {
      const query = studentSearch.value.trim();

      if (!query) {
        searchNotice.textContent = "학생 검색 데이터는 추후 연결됩니다.";
        return;
      }

      searchNotice.textContent =
        `"${query}" 검색 기능은 학생 데이터 등록 후 사용할 수 있습니다.`;
    });
  </script>

</body>
</html>
