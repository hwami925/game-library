<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블루 아카이브 | 게임창고</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: #214563;
      background:
        radial-gradient(circle at 85% 15%, #b5e5ff 0%, transparent 40%),
        linear-gradient(135deg, #f4fbff, #dcefff);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image:
        linear-gradient(#fff 1px, transparent 1px),
        linear-gradient(90deg, #fff 1px, transparent 1px);
      background-size: 60px 60px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 6%;
      background: rgba(255, 255, 255, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .site-name {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .back-button {
      color: #438fbf;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      position: relative;
      width: min(1100px, 100%);
      min-height: calc(100vh - 72px);
      margin: 0 auto;
      padding: 65px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .system-label {
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    /* 블루 아카이브 타이틀 */
    .game-title {
      margin: 10px 0 28px;
      font-size: clamp(36px, 6vw, 65px);
      letter-spacing: 2px;
    }

    /* 블루 아카이브 로고 */
    .game-logo {
      display: block;
      width: 350px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* 메인 대시보드 */
    .dashboard {
      padding: clamp(24px, 4vw, 45px);
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid white;
      border-radius: 26px;
      box-shadow: 0 20px 55px rgba(61, 136, 190, 0.12);
      backdrop-filter: blur(15px);
    }

    .welcome {
      color: #5296c4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .dashboard h2 {
      margin: 10px 0;
      font-size: clamp(24px, 4vw, 36px);
    }

    .description {
      color: #718da4;
      margin-bottom: 32px;
    }

    /* 메뉴 배치 */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    /* 메뉴 카드 */
    .menu-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 30px;
      min-height: 155px;
      background: rgba(240, 249, 255, 0.9);
      border: 1px solid #b8e2fa;
      border-radius: 18px;
      transition:
        transform 0.25s,
        box-shadow 0.25s,
        border-color 0.25s;
    }

    .menu-card:hover {
      transform: translateY(-5px);
      border-color: #54b4ed;
      box-shadow: 0 15px 30px rgba(54, 145, 205, 0.15);
    }

    /* 학생기록부 강조 */
    .menu-card.featured {
      grid-column: 1 / -1;
      background: white;
      min-height: 175px;
    }

    .menu-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 78px;
      height: 78px;
      border-radius: 18px;
      background: #ddf2ff;
      color: #268dcc;
      font-size: 38px;
    }

    .menu-text h3 {
      margin: 0 0 9px;
      font-size: 24px;
    }

    .menu-text p {
      margin: 0;
      color: #718da4;
      font-size: 14px;
      line-height: 1.6;
    }

    .arrow {
      margin-left: auto;
      font-size: 28px;
      color: #268dcc;
    }

    /* 준비 중 메뉴 */
    .disabled {
      opacity: 0.65;
      cursor: default;
    }

    .disabled:hover {
      transform: none;
      box-shadow: none;
      border-color: #b8e2fa;
    }

    /* 시스템 상태 표시 */
    .status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 25px;
      color: #5296c4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4cc1d8;
      box-shadow: 0 0 10px #4cc1d8;
    }

    /* 모바일 화면 */
    @media (max-width: 650px) {
      header {
        padding: 18px 20px;
      }

      main {
        padding: 35px 18px;
      }

      .dashboard {
        padding: 22px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-card.featured {
        grid-column: auto;
      }

      .menu-card {
        padding: 20px;
        min-height: 125px;
      }

      .menu-icon {
        width: 60px;
        height: 60px;
        font-size: 30px;
      }

      .menu-text h3 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- 상단 메뉴 -->
  <header>
    <a class="site-name" href="../index.html">
      📦 게임창고
    </a>

    <a class="back-button" href="../index.html">
      ← 게임 선택
    </a>
  </header>

  <main>

    <!-- 시스템 이름 -->
    <div class="system-label">
      SCHALE INFORMATION SYSTEM
    </div>

    <!-- 블루 아카이브 로고 -->
    <h1 class="game-title">
      <img
        src="../images/bluearchive/logo/bluearchive-logo.png"
        alt="블루 아카이브"
        class="game-logo"
      >
    </h1>

    <!-- 샬레 대시보드 -->
    <section class="dashboard">

      <div class="welcome">
        WELCOME, SENSEI
      </div>

      <h2>샬레 정보 관리 시스템</h2>

      <p class="description">
        열람할 데이터베이스를 선택해 주세요.
      </p>

      <!-- 메뉴 -->
      <div class="menu-grid">

        <!-- 학생기록부 -->
        <a class="menu-card featured" href="schools.html">

          <div class="menu-icon">
            ▤
          </div>

          <div class="menu-text">
            <h3>학생기록부</h3>
            <p>학교 · 동아리 · 학생 · 이격별 상세 정보</p>
          </div>

          <span class="arrow">↗</span>

        </a>

        <!-- 총력전 -->
        <div class="menu-card disabled">

          <div class="menu-icon">
            ⚔
          </div>

          <div class="menu-text">
            <h3>총력전</h3>
            <p>보스 정보 · 공략 · 추천 파티</p>
          </div>

        </div>

        <!-- 미래시 -->
        <div class="menu-card disabled">

          <div class="menu-icon">
            ▦
          </div>

          <div class="menu-text">
            <h3>미래시</h3>
            <p>향후 픽업 · 이벤트 일정</p>
          </div>

        </div>

      </div>

      <!-- 시스템 상태 -->
      <div class="status">
        <span class="status-dot"></span>
        SCHALE DATABASE / ONLINE
      </div>

    </section>

  </main>

</body>
</html>
