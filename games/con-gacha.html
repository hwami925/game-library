
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘 뽑기 | 게임창고</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #202b43;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .gacha-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 35px 20px;
    }

    h1 { color: #f6b5d1; }

    .plinko-board {
      position: relative;
      width: 100%;
     height: 710px;
      margin-top: 30px;
      background: #35445f;
      border: 5px solid #f6b5d1;
      border-radius: 20px;
      overflow: hidden;
    }

    .category-area {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      height: 85px;
    }

    .category {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 2px solid #fff;
      background: #526583;
      font-weight: bold;
    }
    
.category.shuffle-effect {
  animation: categoryShuffle 0.55s ease;
}

@keyframes categoryShuffle {
  0% {
    transform: scale(1);
    filter: brightness(1);
  }
  35% {
    transform: scale(0.94);
    filter: brightness(1.9);
    background: #ffd166;
  }
  70% {
    transform: scale(1.04);
    filter: brightness(1.5);
  }
  100% {
    transform: scale(1);
    filter: brightness(1);
  }
}


    .draw-button {
      margin-top: 25px;
      padding: 15px 40px;
      border: none;
      border-radius: 30px;
      background: #f6b5d1;
      color: #54243c;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
   
.plinko-pin {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #f6b5d1;
  border: 2px solid #fff;
  box-shadow: 0 0 8px #f6b5d180;
  transform: translate(-50%, -50%);
}

.plinko-pin.special {
  width: 14px;
  height: 14px;
  background: #ffd166;
  border: 2px solid #fff4c2;
  box-shadow:
    0 0 10px #ffd166,
    0 0 20px #ffd16666;
}

    .plinko-ball {
  position: absolute;
  z-index: 5;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 30%,
    #fff9d7,
    #ffd166 65%,
    #e49a35
  );
  box-shadow: 0 0 12px #ffd16688;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

}

/* 여기부터 당첨 결과창 CSS 추가 */

/* 당첨 결과창 */
.con-result {
  display: none;
  position: fixed;
  z-index: 100;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90%, 360px);
  padding: 30px;
  background: #fff8fc;
  color: #54243c;
  border: 5px solid #f6b5d1;
  border-radius: 24px;
  box-shadow: 0 0 0 100vmax #0009;
  animation: conAppear 0.4s ease-out;
}

.con-result.show {
  display: block;
}

.con-result img {
  display: block;
  width: 180px;
  height: 180px;
  max-width: 100%;
  object-fit: contain;
  margin: 15px auto;
}

.con-result button {
  padding: 12px 35px;
  border: none;
  border-radius: 25px;
  background: #f6b5d1;
  color: #54243c;
  font-weight: bold;
  cursor: pointer;
}

@keyframes conAppear {
  from {
    opacity: 0;
    transform: translate(-50%, -45%) scale(0.7);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

}
    
/* 콘 보관함 */
.con-collection {
  margin-top: 45px;
  padding: 25px;
  background: #2d3952;
  border: 2px solid #f6b5d1;
  border-radius: 20px;
}

.con-collection h2 {
  color: #f6b5d1;
}

.con-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.con-card {
  padding: 15px;
  background: #465674;
  border-radius: 15px;
}

.con-card img {
  width: 100%;
  height: 130px;
  object-fit: contain;
}

.con-card.locked {
  background: #252e42;
  color: #9da8bb;
}

.con-locked-image {
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: bold;
}

</style>
</head>
<body>
  <main class="gacha-container">
    <h1>🎰 CON GACHA</h1>
    <p>오늘의 무료 콘 뽑기!</p>

    <div class="plinko-board" id="plinkoBoard">
      <div class="category-area">
        <div class="category">블루 아카이브</div>
        <div class="category">명조</div>
      </div>
    </div>

    <button class="draw-button" id="drawButton">
      뽑기 시작!
    </button>
    
<div class="con-result" id="conResult">
  <h2 id="resultTitle">🎉 CON GET!</h2>
  <img id="resultImage" src="" alt="당첨 콘">
  <p id="resultName"></p>
  <button id="closeResult">확인!</button>
</div>


    <p>매일 00:00에 뽑기 기회가 초기화됩니다.</p>
    
<section class="con-collection">
  <h2>📚 나의 콘 보관함</h2>
  <p id="collectionCount">획득한 콘 0 / 2</p>
  <div class="con-grid" id="conGrid"></div>
</section>

  </main>
  <script src="cons.js"></script>
  <script>
 
const board = document.getElementById("plinkoBoard");
const drawButton = document.getElementById("drawButton");
    
const conResult = document.getElementById("conResult");
const resultTitle = document.getElementById("resultTitle");
const resultImage = document.getElementById("resultImage");
const resultName = document.getElementById("resultName");
const closeResult = document.getElementById("closeResult");

const conGameMap = {
  "블루 아카이브": "shiroko-sparkle",
  "명조": "aemes-daughter"
};

    
// 획득한 콘 목록 불러오기
function getOwnedCons() {
  return JSON.parse(localStorage.getItem("ownedCons") || "[]");
}

// 획득한 콘 저장하기
function saveOwnedCon(conId) {
  const ownedCons = getOwnedCons();

  // 이미 보유한 콘은 중복 저장하지 않음
  if (!ownedCons.includes(conId)) {
    ownedCons.push(conId);
    localStorage.setItem("ownedCons", JSON.stringify(ownedCons));
  }
}

function renderConCollection() {
  const ownedCons = getOwnedCons();
  const conGrid = document.getElementById("conGrid");
  const collectionCount = document.getElementById("collectionCount");

  conGrid.innerHTML = "";

  CON_LIST.forEach(con => {
    const owned = ownedCons.includes(con.id);

    const card = document.createElement("div");
    card.className = owned ? "con-card" : "con-card locked";

    if (owned) {
      const img = document.createElement("img");
      img.src = con.image;
      img.alt = con.name;
      card.appendChild(img);

      const name = document.createElement("p");
      name.textContent = `${con.character} — ${con.name}`;
      card.appendChild(name);
    } else {
      const locked = document.createElement("div");
      locked.className = "con-locked-image";
      locked.textContent = "???";
      card.appendChild(locked);

      const name = document.createElement("p");
      name.textContent = "미획득";
      card.appendChild(name);
    }

    conGrid.appendChild(card);
  });

  collectionCount.textContent =
    `획득한 콘 ${ownedCons.length} / ${CON_LIST.length}`;
}

function showConResult(game) {
  const conId = conGameMap[game];
  const con = CON_LIST.find(item => item.id === conId);

  if (!con) {
    alert("등록된 콘을 찾을 수 없어!");
    return;
  }

  saveOwnedCon(con.id);

  renderConCollection();
  
  resultTitle.textContent = `🎉 ${game} 당첨!`;
  resultImage.src = con.image;
  resultName.textContent = `${con.character} — ${con.name}`;
  conResult.classList.add("show");
}

closeResult.addEventListener("click", () => {
  conResult.classList.remove("show");
});
// 결과창 표시 테스트


const rows = 12;
const pins = [];

for (let row = 0; row < rows; row++) {
  const pinCount = row % 2 === 0 ? 9 : 8;

  for (let col = 0; col < pinCount; col++) {
    const pin = document.createElement("div");
    pin.className = "plinko-pin";
    // 특수 핀 5개 배치
const specialPins = [
  [2, 3],
  [4, 6],
  [6, 2],
  [8, 7],
  [10, 4]
];

if (specialPins.some(([r, c]) => r === row && c === col)) {
  pin.classList.add("special");
  pin.dataset.special = "true";
}

    // 한 줄씩 엇갈리도록 배치
    const x = row % 2 === 0
      ? 10 + col * 10
      : 15 + col * 10;

    const y = 9 + row * 6.8;

    pin.style.left = `${x}%`;
    pin.style.top = `${y}%`;

    board.appendChild(pin);
    pins.push(pin);
  }
}

let categories = ["블루 아카이브", "명조"];
const categoryElements = [...document.querySelectorAll(".category")];
let animationId = null;

drawButton.addEventListener("click", () => {
  if (animationId !== null) return;
  // 새 뽑기를 시작할 때 카테고리 초기화
categories = ["블루 아카이브", "명조"];

categoryElements.forEach((element, index) => {
  element.textContent = categories[index];
});

  drawButton.disabled = true;
  drawButton.textContent = "공이 내려가는 중...";

  const ball = document.createElement("div");
  ball.className = "plinko-ball";
  board.appendChild(ball);

  const width = board.clientWidth;
  const height = board.clientHeight;
  const radius = 10;
  const floor = height - radius;

  let x = width * (0.4 + Math.random() * 0.2);
  let y = radius + 5;
  let vx = (Math.random() - 0.5) * 2;
  let vy = 0;

  const gravity = 0.13;
  const bounce = 0.75;
  let lastTime = 0;

  const pegPositions = pins.map(pin => ({
  x: pin.offsetLeft,
  y: pin.offsetTop,
  radius: pin.dataset.special === "true" ? 7 : 5,
  special: pin.dataset.special === "true",
  triggered: false
}));


function shuffleCategories() {
  // 카테고리 위치 교환
  categories.reverse();

  categoryElements.forEach((element, index) => {
    element.textContent = categories[index];

    // 연속으로 셔플해도 애니메이션 재실행
    element.classList.remove("shuffle-effect");
    void element.offsetWidth;
    element.classList.add("shuffle-effect");
  });
}


  function animate(time) {
    if (!lastTime) lastTime = time;

    const dt = Math.min((time - lastTime) / 16.67, 2);
    lastTime = time;

    vy += gravity * dt;
    x += vx * dt;
    y += vy * dt;

    // 좌우 벽 충돌
    if (x < radius || x > width - radius) {
      x = Math.max(radius, Math.min(width - radius, x));
      vx *= -0.8;
    }

    // 핀 충돌
    for (const peg of pegPositions) {
      const dx = x - peg.x;
      const dy = y - peg.y;
      const distance = Math.hypot(dx, dy);
      const minDistance = radius + peg.radius;

      if (distance > 0 && distance < minDistance) {
        const nx = dx / distance;
        const ny = dy / distance;

        x = peg.x + nx * minDistance;
        y = peg.y + ny * minDistance;

        const dot = vx * nx + vy * ny;

        if (dot < 0) {
          vx -= (1 + bounce) * dot * nx;
          vy -= (1 + bounce) * dot * ny;

          // 미세한 무작위 반동
          vx += (Math.random() - 0.5) * 1.5;
          // 황금 핀에 처음 충돌했을 때 카테고리 셔플
if (peg.special && !peg.triggered) {
  peg.triggered = true;
  shuffleCategories();

  // 황금 핀 충돌 효과
  drawButton.textContent = "✨ SHUFFLE! ✨";
}
        }
      }
    }

    // 게임 카테고리 중앙 칸막이 충돌
    const dividerX = width / 2;
    const categoryTop = height - 85;

    // 가운데 칸막이의 두께
    const dividerHalfWidth = 2;

    if (y + radius > categoryTop && y - radius < height) {
      const distanceX = x - dividerX;
      const minDistance = radius + dividerHalfWidth;

      if (Math.abs(distanceX) < minDistance) {
        // 공이 왼쪽에 있으면 왼쪽으로,
        // 오른쪽에 있으면 오른쪽으로 튕김
        const direction = distanceX < 0 ? -1 : 1;

        x = dividerX + direction * minDistance;
        vx = direction * Math.max(Math.abs(vx) * 0.7, 1.5);
      }
    }

    // 수평 움직임 감쇠
    vx *= 0.998;

    ball.style.left = `${x}px`;
    ball.style.top = `${y}px`;

    if (y >= floor) {
      ball.style.top = `${floor}px`;

      const index = Math.min(
        categories.length - 1,
        Math.floor(x / (width / categories.length))
      );

      drawButton.textContent = `${categories[index]} 당첨!`;
      showConResult(categories[index]);

      cancelAnimationFrame(animationId);
      animationId = null;

      setTimeout(() => {
        ball.remove();
        drawButton.disabled = false;
        drawButton.textContent = "다시 테스트하기";
      }, 1800);

      return;
    }

    animationId = requestAnimationFrame(animate);
  }

  animationId = requestAnimationFrame(animate);
});

    renderConCollection();

</script>
</body>
</html>
