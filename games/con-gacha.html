
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘 뽑기 | 게임창고</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #202b43;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .gacha-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 35px 20px;
    }

    h1 { color: #f6b5d1; }

    .plinko-board {
      position: relative;
      width: 100%;
      height: 650px;
      margin-top: 30px;
      background: #35445f;
      border: 5px solid #f6b5d1;
      border-radius: 20px;
      overflow: hidden;
    }

    .category-area {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      height: 85px;
    }

    .category {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 2px solid #fff;
      background: #526583;
      font-weight: bold;
    }

    .draw-button {
      margin-top: 25px;
      padding: 15px 40px;
      border: none;
      border-radius: 30px;
      background: #f6b5d1;
      color: #54243c;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .plinko-pin {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #f6b5d1;
  border: 2px solid #fff;
  box-shadow: 0 0 8px #f6b5d180;
  transform: translate(-50%, -50%);
}
    .plinko-ball {
  position: absolute;
  z-index: 5;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 30%,
    #fff9d7,
    #ffd166 65%,
    #e49a35
  );
  box-shadow: 0 0 12px #ffd16688;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
  </style>
</head>
<body>
  <main class="gacha-container">
    <h1>🎰 CON GACHA</h1>
    <p>오늘의 무료 콘 뽑기!</p>

    <div class="plinko-board" id="plinkoBoard">
      <div class="category-area">
        <div class="category">블루 아카이브</div>
        <div class="category">명조</div>
      </div>
    </div>

    <button class="draw-button" id="drawButton">
      뽑기 시작!
    </button>

    <p>매일 00:00에 뽑기 기회가 초기화됩니다.</p>
  </main>
  <script>
 
const board = document.getElementById("plinkoBoard");
const drawButton = document.getElementById("drawButton");

const rows = 10;
const pins = [];

for (let row = 0; row < rows; row++) {
  const pinCount = row % 2 === 0 ? 6 : 5;

  for (let col = 0; col < pinCount; col++) {
    const pin = document.createElement("div");
    pin.className = "plinko-pin";

    const x = (col + 1) * (100 / (pinCount + 1));
    const y = 10 + row * 8;

    pin.style.left = `${x}%`;
    pin.style.top = `${y}%`;

    board.appendChild(pin);
    pins.push(pin);
  }
}

let animationId = null;

drawButton.addEventListener("click", () => {
  if (animationId !== null) return;

  drawButton.disabled = true;
  drawButton.textContent = "공이 내려가는 중...";

  const ball = document.createElement("div");
  ball.className = "plinko-ball";
  board.appendChild(ball);

  const width = board.clientWidth;
  const height = board.clientHeight;
  const radius = 10;
  const floor = height - radius;

  let x = width * (0.4 + Math.random() * 0.2);
  let y = radius + 5;
  let vx = (Math.random() - 0.5) * 2;
  let vy = 0;

  const gravity = 0.13;
  const bounce = 0.75;
  let lastTime = 0;

  const pegPositions = pins.map(pin => ({
    x: pin.offsetLeft,
    y: pin.offsetTop
  }));

  function animate(time) {
    if (!lastTime) lastTime = time;

    const dt = Math.min((time - lastTime) / 16.67, 2);
    lastTime = time;

    vy += gravity * dt;
    x += vx * dt;
    y += vy * dt;

    // 좌우 벽 충돌
    if (x < radius || x > width - radius) {
      x = Math.max(radius, Math.min(width - radius, x));
      vx *= -0.8;
    }

    // 핀 충돌
    for (const peg of pegPositions) {
      const dx = x - peg.x;
      const dy = y - peg.y;
      const distance = Math.hypot(dx, dy);
      const minDistance = radius + 6;

      if (distance > 0 && distance < minDistance) {
        const nx = dx / distance;
        const ny = dy / distance;

        x = peg.x + nx * minDistance;
        y = peg.y + ny * minDistance;

        const dot = vx * nx + vy * ny;

        if (dot < 0) {
          vx -= (1 + bounce) * dot * nx;
          vy -= (1 + bounce) * dot * ny;

          // 미세한 무작위 반동
          vx += (Math.random() - 0.5) * 1.5;
        }
      }
    }

    // 수평 움직임 감쇠
    vx *= 0.998;

    ball.style.left = `${x}px`;
    ball.style.top = `${y}px`;

    if (y >= floor) {
      ball.style.top = `${floor}px`;

      const categories = ["블루 아카이브", "명조"];
      const index = Math.min(
        categories.length - 1,
        Math.floor(x / (width / categories.length))
      );

      drawButton.textContent = `${categories[index]} 당첨!`;

      cancelAnimationFrame(animationId);
      animationId = null;

      setTimeout(() => {
        ball.remove();
        drawButton.disabled = false;
        drawButton.textContent = "다시 테스트하기";
      }, 1800);

      return;
    }

    animationId = requestAnimationFrame(animate);
  }

  animationId = requestAnimationFrame(animate);
});

</script>
</body>
</html>
