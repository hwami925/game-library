
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘 뽑기 | 게임창고</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #202b43;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .gacha-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 35px 20px;
    }

    h1 { color: #f6b5d1; }

    .plinko-board {
      position: relative;
      width: 100%;
     height: 710px;
      margin-top: 30px;
      background: #35445f;
      border: 5px solid #f6b5d1;
      border-radius: 20px;
      overflow: hidden;
    }

    .category-area {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      height: 85px;
    }

    .category {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 2px solid #fff;
      background: #526583;
      font-weight: bold;
      font-size: clamp(10px, 2.2vw, 14px);
      overflow-wrap: anywhere;
    }
    
.category.shuffle-effect {
  animation: categoryShuffle 0.55s ease;
}

@keyframes categoryShuffle {
  0% {
    transform: scale(1);
    filter: brightness(1);
  }
  35% {
    transform: scale(0.94);
    filter: brightness(1.9);
    background: #ffd166;
  }
  70% {
    transform: scale(1.04);
    filter: brightness(1.5);
  }
  100% {
    transform: scale(1);
    filter: brightness(1);
  }
}


    .collection-link {
      display: inline-block;
      margin: 16px auto 0;
      padding: 13px 24px;
      border: 2px solid #f6b5d1;
      border-radius: 30px;
      color: #f6b5d1;
      font-weight: bold;
      text-decoration: none;
    }
    .collection-link:hover, .collection-link:focus-visible {
      background: #f6b5d1;
      color: #202b43;
    }
    .draw-button {
      margin-top: 25px;
      padding: 15px 40px;
      border: none;
      border-radius: 30px;
      background: #f6b5d1;
      color: #54243c;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
   
.plinko-pin {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #f6b5d1;
  border: 2px solid #fff;
  box-shadow: 0 0 8px #f6b5d180;
  transform: translate(-50%, -50%);
}

.plinko-pin.special {
  width: 14px;
  height: 14px;
  background: #ffd166;
  border: 2px solid #fff4c2;
  box-shadow:
    0 0 10px #ffd166,
    0 0 20px #ffd16666;
}

    .plinko-ball {
  position: absolute;
  z-index: 5;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 30%,
    #fff9d7,
    #ffd166 65%,
    #e49a35
  );
  box-shadow: 0 0 12px #ffd16688;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
   
/* 여기부터 당첨 결과창 CSS 추가 */

/* 당첨 결과창 */
.con-result {
  display: none;
  position: fixed;
  z-index: 100;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90%, 360px);
  padding: 30px;
  background: #fff8fc;
  color: #54243c;
  border: 5px solid #f6b5d1;
  border-radius: 24px;
  box-shadow: 0 0 0 100vmax #0009;
  animation: conAppear 0.4s ease-out;
}

.con-result.show {
  display: block;
}

.con-result img {
  display: block;
  width: 180px;
  height: 180px;
  max-width: 100%;
  object-fit: contain;
  margin: 15px auto;
}

.con-result button {
  padding: 12px 35px;
  border: none;
  border-radius: 25px;
  background: #f6b5d1;
  color: #54243c;
  font-weight: bold;
  cursor: pointer;
}

@keyframes conAppear {
  from {
    opacity: 0;
    transform: translate(-50%, -45%) scale(0.7);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}
    
/* 모든 콘을 획득한 카테고리 */
.category.completed {
  background: #252e42;
  color: #9da8bb;
  border-color: #758097;
}
.back-home {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 9999;

  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.9);
  color: #333;
  border-radius: 12px;

  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.back-home:hover {
  background: #ffe1ef;
}
</style>
</head>
<body>
  <a href="../index.html" class="back-home">
  ← 게임창고로 돌아가기
</a>
  <main class="gacha-container">
    <h1>🎰 CON GACHA</h1>
    <p>오늘의 무료 콘 뽑기!</p>

    <div class="plinko-board" id="plinkoBoard">
      <div class="category-area">
        <div class="category">블루 아카이브</div>
        <div class="category">명조</div>
        <div class="category">트릭컬</div>
      </div>
    </div>

    <button class="draw-button" id="drawButton">
      뽑기 시작!
    </button>
    
<div class="con-result" id="conResult">
  <h2 id="resultTitle">🎉 CON GET!</h2>
  <img id="resultImage" src="" alt="당첨 콘">
  <p id="resultName"></p>
  <button id="closeResult">확인!</button>
</div>


    <p id="dailyStatus" aria-live="polite">매일 한국 시간 00:00에 뽑기 기회가 초기화됩니다.</p>
    
<a class="collection-link" href="con-collection.html">📚 나의 콘 보관함 보기 →</a>

  </main>
  <script src="cons.js"></script>
  <script type="module">
  import {kstDate,waitForGoogle,migrateOnce,loadCloud,cacheState,claimCon} from "./con-cloud.js";
 
const board = document.getElementById("plinkoBoard");
const drawButton = document.getElementById("drawButton");
const dailyStatus = document.getElementById("dailyStatus");
    
const conResult = document.getElementById("conResult");
const resultTitle = document.getElementById("resultTitle");
const resultImage = document.getElementById("resultImage");
const resultName = document.getElementById("resultName");
const closeResult = document.getElementById("closeResult");

const conGameMap = {
  "블루 아카이브": "shiroko-sparkle",
  "명조": "aemes-daughter",
  "트릭컬": "butter-kkojiri"
};

    
// 한국 시간(KST) 기준 날짜. 컴퓨터의 시간대 설정과 무관하게 날짜를 계산합니다.
const DAILY_DRAW_KEY = 'conGachaLastSuccessfulDrawKST';
let cloudUser = null, cloudState = {ownedCons:[],lastDrawKST:''}, cloudReady = false, saving = false;
const getKoreanDate = kstDate;
function hasDrawnToday(){return cloudState.lastDrawKST === getKoreanDate();}
function updateDailyDrawStatus(){
  if(animationId !== null || saving)return;
  if(!cloudReady){drawButton.disabled=true;drawButton.textContent='로그인 확인 중...';return;}
  const allCollected=CON_LIST.every(c=>getOwnedCons().includes(c.id));
  if(allCollected){drawButton.disabled=true;drawButton.textContent='🎉 모든 콘 획득 완료!';dailyStatus.textContent='모든 콘을 모았어!';}
  else if(hasDrawnToday()){drawButton.disabled=true;drawButton.textContent='🌙 오늘의 뽑기 완료';dailyStatus.textContent='한국 시간 내일 00:00에 다시 도전해 줘.';}
  else{drawButton.disabled=false;drawButton.textContent='뽑기 시작!';dailyStatus.textContent='오늘의 무료 뽑기 1회 남음 · 한국 시간 00:00 초기화';}
}
// 획득한 콘 목록 불러오기
function getOwnedCons() {
  return cloudState.ownedCons;
}
    
function getUnownedCons(game) {
  const ownedCons = getOwnedCons();

  return CON_LIST.filter(con => {
    const gameMatches =
      (game === "블루 아카이브" && con.id === "shiroko-sparkle") ||
      (game === "명조" && con.id === "aemes-daughter") ||
      (game === "트릭컬" && con.id === "butter-kkojiri");

    return gameMatches && !ownedCons.includes(con.id);
  });
}

function updateCategoryLocks() {
  document.querySelectorAll(".category").forEach((element, index) => {
    const game = categories[index];
    const completed = getUnownedCons(game).length === 0;

    element.classList.toggle("completed", completed);
    element.textContent = completed ? `🔒 ${game}` : game;
  });
}


function showConResult(game, con){
  resultTitle.textContent=`🎉 ${game} 당첨!`;
  resultImage.src=con.image;
  resultName.textContent=`${con.character} — ${con.name}`;
  conResult.classList.add('show');
}
closeResult.addEventListener("click", () => {
  conResult.classList.remove("show");
});
// 결과창 표시 테스트


const rows = 12;
const pins = [];

for (let row = 0; row < rows; row++) {
  const pinCount = row % 2 === 0 ? 9 : 8;

  for (let col = 0; col < pinCount; col++) {
    const pin = document.createElement("div");
    pin.className = "plinko-pin";
    // 특수 핀 5개 배치
const specialPins = [
  [2, 3],
  [4, 6],
  [6, 2],
  [8, 7],
  [10, 4]
];

if (specialPins.some(([r, c]) => r === row && c === col)) {
  pin.classList.add("special");
  pin.dataset.special = "true";
}

    // 한 줄씩 엇갈리도록 배치
    const x = row % 2 === 0
      ? 10 + col * 10
      : 15 + col * 10;

    const y = 9 + row * 6.8;

    pin.style.left = `${x}%`;
    pin.style.top = `${y}%`;

    board.appendChild(pin);
    pins.push(pin);
  }
}

let categories = ["블루 아카이브", "명조", "트릭컬"];
const categoryElements = [...document.querySelectorAll(".category")];
let animationId = null;

drawButton.addEventListener("click", () => {
  if(!cloudReady)return;
  if (animationId !== null) return;
  if (hasDrawnToday()) {
    updateDailyDrawStatus();
    return;
  }
  
const remainingCons = CON_LIST.filter(
  con => !getOwnedCons().includes(con.id)
);

if (remainingCons.length === 0) {
  alert("🎉 모든 콘을 획득했어! 새로운 콘을 기다려 줘!");
  return;
}

  // 새 뽑기를 시작할 때 카테고리 초기화
categories = ["블루 아카이브", "명조", "트릭컬"];

categoryElements.forEach((element, index) => {
  element.textContent = categories[index];
});
updateCategoryLocks();

  drawButton.disabled = true;
  drawButton.textContent = "공이 내려가는 중...";

  const ball = document.createElement("div");
  ball.className = "plinko-ball";
  board.appendChild(ball);

  const width = board.clientWidth;
  const height = board.clientHeight;
  const radius = 10;
  const floor = height - radius;

  let x = width * (0.4 + Math.random() * 0.2);
  let y = radius + 5;
  let vx = (Math.random() - 0.5) * 2;
  let vy = 0;

  const gravity = 0.13;
  const bounce = 0.75;
  let lastTime = 0;

  const pegPositions = pins.map(pin => ({
  x: pin.offsetLeft,
  y: pin.offsetTop,
  radius: pin.dataset.special === "true" ? 7 : 5,
  special: pin.dataset.special === "true",
  triggered: false
}));



function shuffleCategories() {
  // 세 게임 이상에서도 실제 카테고리 순서를 무작위로 섞습니다.
  const previous = categories.join("|");
  for (let i = categories.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [categories[i], categories[j]] = [categories[j], categories[i]];
  }
  if (categories.join("|") === previous) {
    [categories[0], categories[1]] = [categories[1], categories[0]];
  }

  categoryElements.forEach((element, index) => {
    element.textContent = categories[index];

    element.classList.remove("shuffle-effect");
    void element.offsetWidth;
    element.classList.add("shuffle-effect");
  });

  updateCategoryLocks();
}



  function animate(time) {
    if (!lastTime) lastTime = time;

    const dt = Math.min((time - lastTime) / 16.67, 2);
    lastTime = time;

    vy += gravity * dt;
    x += vx * dt;
    y += vy * dt;

    // 좌우 벽 충돌
    if (x < radius || x > width - radius) {
      x = Math.max(radius, Math.min(width - radius, x));
      vx *= -0.8;
    }

    // 핀 충돌
    for (const peg of pegPositions) {
      const dx = x - peg.x;
      const dy = y - peg.y;
      const distance = Math.hypot(dx, dy);
      const minDistance = radius + peg.radius;

      if (distance > 0 && distance < minDistance) {
        const nx = dx / distance;
        const ny = dy / distance;

        x = peg.x + nx * minDistance;
        y = peg.y + ny * minDistance;

        const dot = vx * nx + vy * ny;

        if (dot < 0) {
          vx -= (1 + bounce) * dot * nx;
          vy -= (1 + bounce) * dot * ny;

          // 미세한 무작위 반동
          vx += (Math.random() - 0.5) * 1.5;
          // 황금 핀에 처음 충돌했을 때 카테고리 셔플
if (peg.special && !peg.triggered) {
  peg.triggered = true;
  shuffleCategories();

  // 황금 핀 충돌 효과
  drawButton.textContent = "✨ SHUFFLE! ✨";
}
        }
      }
    }

    // 세 카테고리의 두 칸막이와 공 충돌 처리
    const categoryTop = height - 85;
    const dividerHalfWidth = 2;
    if (y + radius > categoryTop && y - radius < height) {
      for (let dividerIndex = 1; dividerIndex < categories.length; dividerIndex++) {
        const dividerX = width * dividerIndex / categories.length;
        const distanceX = x - dividerX;
        const minDistance = radius + dividerHalfWidth;
        if (Math.abs(distanceX) < minDistance) {
          const direction = distanceX < 0 ? -1 : 1;
          x = dividerX + direction * minDistance;
          vx = direction * Math.max(Math.abs(vx) * 0.7, 1.5);
        }
      }
    }

    // 수평 움직임 감쇠
    vx *= 0.998;

    ball.style.left = `${x}px`;
    ball.style.top = `${y}px`;

    if (y >= floor) {
      ball.style.top = `${floor}px`;

      const index = Math.min(
        categories.length - 1,
        Math.floor(x / (width / categories.length))
      );

      const landedGame = categories[index];
             if(getUnownedCons(landedGame).length===0){
         drawButton.textContent='🔒 이미 획득한 게임! 재도전!';
       }else{
         // 애니메이션은 여기서 종료하고, 서버 저장이 성공한 뒤에만 당첨 표시
         const conId=conGameMap[landedGame];
         const con=CON_LIST.find(c=>c.id===conId);
         drawButton.textContent='당첨 기록 저장 중...';
         saving=true;drawButton.disabled=true;
         claimCon(cloudUser,conId).then(result=>{
           if(result.ok){cloudState=result.state;showConResult(landedGame,con);updateCategoryLocks();}
           else if(result.reason==='today')alert('다른 기기에서 이미 오늘 뽑기를 완료했어!');
           else alert('이미 획득한 콘이야.');
         }).catch(err=>{console.error(err);alert('Firebase 저장에 실패했어. 다시 시도해 줘.');})
           .finally(async()=>{try{cloudState=await loadCloud(cloudUser);cacheState(cloudState);}catch(e){console.error(e);}saving=false;updateCategoryLocks();updateDailyDrawStatus();});
       }

cancelAnimationFrame(animationId);
      animationId = null;

      setTimeout(() => {
        ball.remove();
        updateDailyDrawStatus();
      }, 1800);

      return;
    }

    animationId = requestAnimationFrame(animate);
  }

  animationId = requestAnimationFrame(animate);
});

async function initCloud(){
  drawButton.disabled=true;dailyStatus.textContent='Google 계정 확인 중...';
  cloudUser=await waitForGoogle();
  if(!cloudUser){dailyStatus.textContent='콘을 뽑으려면 게임창고 메인에서 Google 로그인을 해 줘.';drawButton.textContent='로그인 필요';return;}
  try{cloudState=await migrateOnce(cloudUser);cloudReady=true;updateCategoryLocks();updateDailyDrawStatus();}
  catch(err){console.error(err);dailyStatus.textContent='계정 동기화 실패: '+err.message;drawButton.textContent='동기화 실패';}
}
initCloud();

    // 자정이 지난 뒤 페이지를 열어 둔 상태에서도 버튼을 갱신합니다.
    setInterval(updateDailyDrawStatus, 15000);
    window.addEventListener("focus", updateDailyDrawStatus);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) updateDailyDrawStatus();
    });

</script>
</body>
</html>
