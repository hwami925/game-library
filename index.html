<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임창고</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 기존 메인 디자인을 유지하면서 상단에 콘 뽑기 링크만 추가 */
    header .con-gacha-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,.35);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: background .2s, transform .2s;
    }
    header .con-gacha-link:hover,
    header .con-gacha-link:focus-visible {
      background: rgba(255,255,255,.2);
      transform: translateY(-2px);
    }
    header .con-gacha-link:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (max-width: 480px) {
      header .con-gacha-link { padding: 7px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- 선택한 게임의 배경 -->
  <div id="background-layer"></div>

  <div class="page-container">

    <!-- 상단 -->
    <header>
      <h1>게임창고</h1>
      <nav aria-label="상단 메뉴">
        <a class="con-gacha-link" href="games/con-gacha.html">🎰 콘 뽑기</a>
      </nav>
    </header>

    <!-- 선택한 게임 정보 -->
    <main>
      <section id="game-info">
        <p id="game-number">01 / 12</p>

        <h2 id="game-title">블루 아카이브</h2>

        <p id="game-description">
          학생 정보 · 학교 · 동아리 · 캐릭터별 상세 정보
        </p>

        <button id="enter-button" type="button">
          입장하기 →
        </button>
      </section>
    </main>

    <!-- 하단 게임 선택 -->
    <section id="game-selector">
      <div class="selector-header">
        <span>GAME SELECT</span>
        <span id="selector-count">12 GAMES</span>
      </div>

      <div class="selector-controls">
        <button id="prev-button" type="button" aria-label="이전 게임">
          ‹
        </button>

        <div id="game-list">
          <!-- 게임 아이콘이 자동으로 생성되는 공간 -->
        </div>

        <button id="next-button" type="button" aria-label="다음 게임">
          ›
        </button>
      </div>
    </section>

    <footer>
      <p>게임창고</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
