<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임창고</title>
  <link rel="stylesheet" href="style.css">
  <style>
    header .con-gacha-link, header .account-button {
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      padding:8px 14px; border:1px solid rgba(255,255,255,.45);
      border-radius:999px; color:#fff; background:rgba(0,0,0,.35);
      font:700 14px/1.3 inherit; font-family:inherit; font-size:14px; font-weight:700;
      text-decoration:none; white-space:nowrap; cursor:pointer;
      transition:background .2s,transform .2s;
    }
    header .con-gacha-link:hover, header .account-button:hover,
    header .con-gacha-link:focus-visible, header .account-button:focus-visible {
      background:rgba(255,255,255,.2); transform:translateY(-2px);
    }
    header .con-gacha-link:focus-visible, header .account-button:focus-visible {
      outline:2px solid #fff; outline-offset:3px;
    }
    header nav { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; }
    header .account-button:disabled { opacity:.55; cursor:wait; }
    #account-status { color:#fff; font-size:13px; font-weight:700; text-shadow:0 1px 3px #000; }
    .account-dialog { border:0; border-radius:18px; padding:0; width:min(92vw,410px); color:#242424; }
    .account-dialog::backdrop { background:rgba(0,0,0,.68); }
    .account-dialog-inner { padding:26px; display:grid; gap:14px; background:#fff; }
    .account-dialog h2 { margin:0; font-size:22px; }
    .account-dialog p { margin:0; line-height:1.6; color:#555; }
    .account-dialog label { font-weight:700; }
    .account-dialog input { width:100%; box-sizing:border-box; padding:12px; border:1px solid #aaa; border-radius:9px; font:inherit; }
    .account-dialog button { border:0; border-radius:9px; padding:12px; background:#e878a4; color:#fff; font:700 15px inherit; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; }
    .account-dialog button:disabled { opacity:.55; cursor:wait; }
    .account-dialog .secondary-button { background:#777; }
    #account-error { color:#ba1945; font-size:13px; min-height:1em; }
    @media(max-width:480px) {
      header .con-gacha-link,header .account-button { padding:7px 10px; font-size:12px; }
      #account-status { font-size:12px; }
    }
    [hidden] {
  display: none !important;
}
  </style>
</head>
<body>
  <div id="background-layer"></div>
  <div class="page-container">
    <header>
      <h1>게임창고</h1>
      <nav aria-label="상단 메뉴">
        <a class="con-gacha-link" href="games/con-gacha.html">🎰 콘 뽑기</a>
        <span id="account-status" aria-live="polite"></span>
        <button id="account-login" class="account-button" type="button" disabled>로그인 준비 중…</button>
        <button id="account-nickname" class="account-button" type="button" hidden>닉네임 변경</button>
        <button id="account-logout" class="account-button" type="button" hidden>로그아웃</button>
      </nav>
    </header>
    <main>
      <section id="game-info">
        <p id="game-number">01 / 12</p>
        <h2 id="game-title">블루 아카이브</h2>
        <p id="game-description">학생 정보 · 학교 · 동아리 · 캐릭터별 상세 정보</p>
        <button id="enter-button" type="button">입장하기 →</button>
      </section>
    </main>
    <section id="game-selector">
      <div class="selector-header"><span>GAME SELECT</span><span id="selector-count">12 GAMES</span></div>
      <div class="selector-controls">
        <button id="prev-button" type="button" aria-label="이전 게임">‹</button>
        <div id="game-list"></div>
        <button id="next-button" type="button" aria-label="다음 게임">›</button>
      </div>
    </section>
    <footer><p>게임창고</p></footer>
  </div>

  <dialog id="nickname-dialog" class="account-dialog" aria-labelledby="nickname-title">
    <form id="nickname-form" class="account-dialog-inner">
      <h2 id="nickname-title">게임창고 닉네임</h2>
      <p>게임창고에서 사용할 닉네임을 정해 줘! 2~12자, 한글·영문·숫자만 사용할 수 있어.</p>
      <label for="nickname-input">닉네임</label>
      <input id="nickname-input" type="text" minlength="2" maxlength="12" autocomplete="nickname" required placeholder="예: 화미">
      <span id="account-error" role="alert"></span>
      <button id="nickname-save" type="submit">저장하기</button>
      <button id="nickname-cancel" class="secondary-button" type="button" hidden>취소</button>
    </form>
  </dialog>

  <script src="script.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, linkWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyB0iHUdxg0dCv-TjvusjJjOt_scngwLZE8',
      authDomain: 'game-library-7e014.firebaseapp.com',
      projectId: 'game-library-7e014',
      storageBucket: 'game-library-7e014.firebasestorage.app',
      messagingSenderId: '780822464752',
      appId: '1:780822464752:web:6c1306decb5db7e9669a35',
      measurementId: 'G-7E9DK299B9'
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const loginBtn = document.getElementById('account-login');
    const logoutBtn = document.getElementById('account-logout');
    const nicknameBtn = document.getElementById('account-nickname');
    const status = document.getElementById('account-status');
    const dialog = document.getElementById('nickname-dialog');
    const form = document.getElementById('nickname-form');
    const input = document.getElementById('nickname-input');
    const error = document.getElementById('account-error');
    const cancelBtn = document.getElementById('nickname-cancel');
    const saveBtn = document.getElementById('nickname-save');
    let currentNickname = '';
    let pendingProfile = false;

    function showNickname(required = false) {
      pendingProfile = required;
      input.value = currentNickname;
      error.textContent = '';
      cancelBtn.hidden = required;
      if (!dialog.open) dialog.showModal();
      input.focus();
    }
    function friendlyError(err) {
      if (err?.code === 'auth/popup-closed-by-user' || err?.code === 'auth/cancelled-popup-request') return '로그인 창이 닫혔어. 다시 시도해 줘.';
      if (err?.code === 'auth/popup-blocked') return '팝업이 차단됐어. 이 사이트의 팝업을 허용해 줘.';
      if (err?.code === 'permission-denied') return 'Firestore 권한이 없어. 회원 프로필 보안 규칙을 확인해 줘.';
      return `오류가 발생했어: ${err?.code || err?.message || '알 수 없는 오류'}`;
    }
    loginBtn.addEventListener('click', async () => {
      loginBtn.disabled = true;
      try {
        const user = auth.currentUser;
        if (user?.isAnonymous) {
          try {
            await linkWithPopup(user, provider); // 익명 모모톡 작성자 UID 유지
          } catch (err) {
            if (err.code === 'auth/credential-already-in-use' || err.code === 'auth/email-already-in-use' || err.code === 'auth/provider-already-linked') {
              // 기존 구글 계정은 로그인 가능. 익명 UID의 메시지는 자동으로 이전되지 않음.
              await signInWithPopup(auth, provider);
            } else throw err;
          }
        } else {
          await signInWithPopup(auth, provider);
        }
      } catch (err) {
        alert(friendlyError(err));
      } finally {
        loginBtn.disabled = false;
      }
    });
    logoutBtn.addEventListener('click', async () => {
      try { await signOut(auth); } catch (err) { alert(friendlyError(err)); }
    });
    nicknameBtn.addEventListener('click', () => showNickname(false));
    cancelBtn.addEventListener('click', () => dialog.close());
    dialog.addEventListener('cancel', event => { if (pendingProfile) event.preventDefault(); });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const user = auth.currentUser;
      if (!user || user.isAnonymous) return;
      const nickname = input.value.trim();
      if (!/^[가-힣a-zA-Z0-9]{2,12}$/.test(nickname)) {
        error.textContent = '한글·영문·숫자 2~12자로 입력해 줘.';
        return;
      }
      saveBtn.disabled = true;
      error.textContent = '';
      try {
        await setDoc(doc(db, 'users', user.uid), {
          nickname, updatedAt: serverTimestamp()
        }, { merge: true });
        currentNickname = nickname;
        pendingProfile = false;
        dialog.close();
        status.textContent = `${nickname} 님`;
      } catch (err) {
        error.textContent = friendlyError(err);
      } finally {
        saveBtn.disabled = false;
      }
    });
    onAuthStateChanged(auth, async user => {
      const isGoogle = Boolean(user && !user.isAnonymous);
      loginBtn.hidden = isGoogle;
      loginBtn.disabled = false;
      loginBtn.textContent = 'Google 로그인';
      logoutBtn.hidden = !isGoogle;
      nicknameBtn.hidden = !isGoogle;
      currentNickname = '';
      status.textContent = isGoogle ? '프로필 불러오는 중…' : '';
      if (!isGoogle) { if (dialog.open) dialog.close(); return; }
      try {
        const snapshot = await getDoc(doc(db, 'users', user.uid));
        if (auth.currentUser?.uid !== user.uid) return;
        currentNickname = snapshot.exists() ? (snapshot.data().nickname || '') : '';
        if (currentNickname) status.textContent = `${currentNickname} 님`;
        else { status.textContent = '닉네임 설정 필요'; showNickname(true); }
      } catch (err) {
        status.textContent = '프로필 로딩 실패';
        alert(friendlyError(err));
      }
    });
  </script>
</body>
</html>
