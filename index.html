
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임창고</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 선택한 게임의 배경 -->
  <div id="background-layer"></div>

  <div class="page-container">

    <!-- 상단 -->
    <header>
      <h1>게임창고</h1>
      <nav>게임창고</nav>
    </header>

    <!-- 선택한 게임 정보 -->
    <main>
      <section id="game-info">
        <p id="game-number">01 / 12</p>

        <h2 id="game-title">블루 아카이브</h2>

        <p id="game-description">
          학생 정보 · 학교 · 동아리 · 캐릭터별 상세 정보
        </p>

        <button id="enter-button" type="button">
          입장하기 →
        </button>
      </section>
    </main>

    <!-- 하단 게임 선택 -->
    <section id="game-selector">
      <div class="selector-header">
        <span>GAME SELECT</span>
        <span id="selector-count">12 GAMES</span>
      </div>

      <div class="selector-controls">
        <button id="prev-button" type="button" aria-label="이전 게임">
          ‹
        </button>

        <div id="game-list">
          <!-- 게임 아이콘이 자동으로 생성되는 공간 -->
        </div>

        <button id="next-button" type="button" aria-label="다음 게임">
          ›
        </button>
      </div>
    </section>

    <footer>
      <p>게임창고</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
